# ==========================
# INFORMA\u00c7\u00d5ES DA APLICA\u00c7\u00c3O
# ==========================
spring.application.name=vendas-livros
info.app.description=@project.description@
info.app.encoding=@project.build.sourceEncoding@
info.build.artifact=@project.artifactId@
info.build.group=@project.groupId@
info.build.name=@project.name@
info.build.version=@project.version@

# ==========================
# BANCO DE DADOS H2 (EM MEM\u00d3RIA)
# ==========================
spring.datasource.url=jdbc:h2:mem:vendasdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================
# JPA E HIBERNATE
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================
# CONSOLE DO H2
# ==========================
# Acesse via navegador: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================
# INICIALIZA\u00c7\u00c3O DE DADOS
# ==========================
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ==========================
# SEGURAN\u00c7A E JWT
# ==========================
api.security.token.secret=MySuperSecretKeyForCollegeProjectWhichNeedsToBeLongEnough
